        <script>
            //make this shit more object-oriented!!
            function sourcesToHtml(sourcesObj) {
                let reSourcesObj = {}//fixxxx
                for (let source in sourcesObj) {
                    const sourceObj = sourcesObj[source];
                    const origin = sourceObj.origin;
                    if (!Object.hasOwn(reSourcesObj, origin)) {
                        reSourcesObj[origin] = [];
                    }
                    reSourcesObj[origin].push(source);
                }
                let sourcesHtml = `<li style="padding-top: 0; padding-bottom: 0;">`;
                const selectAll = `
                                    <kelp-select-all id="ss-${origin}-c" target="#${origin}-div [type='checkbox']">
                                            <label for="select-all-${origin}">
                                                <input type="checkbox" id="select-all-${origin}">
                                                select all
                                            </label>
                                        </kelp-select-all>
                `
                for (let origin in reSourcesObj) {
                    let sourcesArr = reSourcesObj[origin];
                    sourcesHtml += `
                                    <li style="padding-top: 0; padding-bottom: 0;"><details>
                                        <summary style="padding: var(--size-m) !important">${origin}</summary>
                                        ${(sourcesArr.length > 1) ? selectAll : ''}
                                        <div id="${origin}-div">`;
                    for (let source of sourcesArr) {
                        sourcesHtml += `
                                            <label for="${source}">
                                                <input type="checkbox" id="${source}" name="${source}" checked /> ${source}
                                            </label>`;
                    }
                    sourcesHtml += `
                                        </div></li>
                    `;
                };
                return sourcesHtml;
            }

            async function updateNews() {
                const jsonReq = await fetch('/api', {
                    method: 'GET',
                    credentials: 'include',
                    mode: 'no-cors',
                });
                const jsonT = await jsonReq.text();
                sourcesObj = JSON.parse(jsonT);
                document.getElementById('disclosed-sources').innerHTML = sourcesToHtml(sourcesObj);
                const newsItems = [];
                for (source in sourcesObj) {
                    const sourceObj = sourcesObj[source];
                    newsItems.push(sourceObj.items);
                }
                return newsItems.flat(2);
            }
            

            function compileNews(newsItems) {
                var compiledHTML = ''
                function unHtml(str) {
                    str = str.replace(/(<[\s\S]*?>)+/g, ' ')
                    str = str.replaceAll('\\n', ' ')
                    str = str.replaceAll(/&[^\s]+?;/g, ' ')
                    str = str.replace(/&[^\s]*?;/g, ' ')
                    str = str.replaceAll('  ', ' ')
                    str = str.replaceAll(' s ', "'s ")
                    return str.split('<')[0]
                }
                for (let i = 0; i < newsItems.length; i++) {
                    const newsItem = newsItems[i]
                    if (newsItem === undefined) {
                        continue;
                    }
                    var { title, pubDate, link, description, imgUrl } = newsItem?.item || newsItem;
                    var pubDate = (new Date(pubDate)).toLocaleString(navigator.languages[0], { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone });
                    var score = newsItem?.score
                    if (imgUrl) {
                        // console.log(imgUrl)
                    }
                    let source = link.split('://')[1].split('/')[0]
                    source = source.toUpperCase()
                    let longTitle = ''
                    let longDesc = ''
                    if (source.split('.').length === 2) {
                        source = source.split('.')[0]
                    }
                    else {
                        source = source.split('.')[1].split('.')[0]
                    }
                    score = 1 - score
                    if (score < 0.3) {
                        continue
                    }
                    if (title.length > 150) {
                        longTitle = title
                        title = title.substring(0, 87) + '...' 
                    }
                    if (source === 'JEWISHCURRENTS') {
                        description = title.split(' - ')[1]
                        title = title.split(' - ')[0]
                    }
                    if (description) {
                        description = description.replace(/\n/g, '')
                        description = description.replace('undefined', '')
                        description = description.replace(/([a-z.,'":;!?])([A-Z])/g, '$1 / $2').replaceAll('Click to expand Image', '')
                        if (description.length > 140) {
                            longDesc = description
                            if (longDesc.length > 500) {
                                longDesc = longDesc.slice(0, longDesc.indexOf(' ', 500) + 1) + '...'
                            }
                            description = longDesc.slice(0, longDesc.indexOf(' ', 110) + 1)
                        }
                        if (longDesc && !imgUrl) {
                            description = longDesc;
                        }
                    }
                    else {
                        description = ''
                    }
                    if (!score) {
                        score = ''
                    }
                    if (typeof title === 'string') {
                        title = title.split(' ')
                        title = title.slice(0,-1).join(' ') + '&nbsp;' + title[title.length-1]
                    }
                    if (longDesc && imgUrl) {
                        description = `<details>
                                        <summary style="margin: 0; padding: 0;">${description}...</summary>
                                        ${longDesc.split(description)[1]}
                                    </details>`
                    }
                    compiledHTML += `
                <div class="news-item" id="${i}" title="${score}"><span class="news-infobar">
                        ${imgUrl ? `<img style="display:block; width: 100%" src="${imgUrl}" />` : ''}
                        (${source}${pubDate ? `, ${pubDate}` : ''})<br />
                        <a href="${link}">${title}</a>
                    </span>
                    <p class="description" ${(!imgUrl && !longDesc) ? 'style="font-size: 1.2em"' : ''}>${description}${(!imgUrl && !longDesc) ? '...' : ''}</p>
                </div>`
                    }
                return compiledHTML.replaceAll(' ()', '')
            }

            function filterSources(newsItems, sourcesObj, sources) {
                const sourceUrls = [];
                for (let i = 0; i < sources.length; i++) {
                    sourceUrls.push(sourcesObj[sources[i].name].url.split('/')[2]);
                }
                const newNewsItems = [];
                for (let newsItem of newsItems) {
                    if (newsItem === undefined) {
                        continue;
                    }
                    console.log(newsItem.link.split('/')[2])
                    if (sourceUrls.includes(newsItem.link.split('/')[2].replace('www.', '') )) {
                        newNewsItems.push(newsItem);
                    }
                }
                console.log(newNewsItems)
                return newNewsItems;
            }

            function searchNews(query, newsItems) {
                const fuse = new Fuse(newsItems, {
                    keys: ['title', 'description', 'link'],
                    ignoreLocation: true,
                    includeScore: true,
                    useExtendedSearch: true,
                    threshold: .3,
                    useTokenSearch: true
                })
                if (query.length > 4) {
                    query = stemmer(query)
                }
                return fuse.search(query)
            }

            function dumpNews(query, newsItems) {
                if (query) {
                    newsItems = searchNews(query, newsItems);
                    newsItems.sort((a,b)=>{
                        const dateA = a.item.normPubDate + a.score/100;
                        console.log(dateA)
                        const dateB = b.item.normPubDate + b.score/100;
                        let diff = dateB - dateA;
                        return dateB-dateA;
                    })
                } else {
                    newsItems.sort((a,b)=>{
                        const dateA = a.pubDate;
                        const dateB = b.pubDate;
                        let diff = dateB - dateA;
                        return dateB-dateA;
                    })
                }
                const newsHtml = compileNews(newsItems);
                const sC = document.getElementById('search-content');
                sC.innerHTML = newsHtml;
                document.body.style.display = 'block';
            }
            
                
                const params = new URL(location.href).searchParams;
                searchbar.value = searchbar.value ? searchbar.value : params.get('q');//?
                
                function getSelectedSources() {
                    const sourceInputs = [...document.querySelectorAll('#disclosed-sources div input')];
                    const sources = [];
                    for (let i = 0; i < sourceInputs.length; i++) {
                        if (sourceInputs[i].checked) {
                            sources.push(sourceInputs[i]);
                        }
                    }
                    return sources;
                }



                //search content -> {height, columns, rows}
                function sConHCR(nNewsI) {

                    var sCon = document.querySelector('#search-content');
                    var sConS = getComputedStyle(sCon);
                    var newsItem1 = document.querySelector('.news-item');
                    var nItem1S = getComputedStyle(newsItem1);

                    const em = +nItem1S.getPropertyValue('font-size').slice(0,-2);

                    style_sheet = document.styleSheets[document.styleSheets.length-1];
                    CSS_Rules = style_sheet.cssRules;

                    for (const rule of CSS_Rules) {
                        if (rule.cssText.includes('.news-item {')) {
                            var nItemStyleS = rule.cssText;
                        }
                    }

                    const emWidth = +nItemStyleS.split('width: ')[1].split('em')[0];
                    const mHeightEm = +nItemStyleS.split('max-height: ')[1].split('em')[0];

                    if (!nNewsI) {
                        return 'no news items?';
                    }

                    var nItem1W = em*emWidth;

                    var sConW = +sConS.getPropertyValue('width').slice(0,-2);

                    var gap = +sConS.getPropertyValue('gap').split('px')[0]
 
                    nItem1W += gap
                    var height = getComputedStyle(newsItem1).height
                    height = height ? height : 'auto'

                    var nCols = Math.floor(sConW/nItem1W)

                    var nRows = Math.ceil(nNewsI/nCols)

                    if (nRows === 1) {
                        nCols = nNewsI
                    }

                    var height = height*nRows

                    return {height, nCols, nRows}
                }


            function styleNews(newsItemsJ) {

                var sCon = document.querySelector('#search-content');
                var sConS = getComputedStyle(sCon);
                var newsItem1 = document.querySelector('.news-item');
                var nItem1S = getComputedStyle(newsItem1);
                // search-content -> {height, nCols, nRows}

                const em = +nItem1S.getPropertyValue('font-size').slice(0,-2);

                style_sheet = document.styleSheets[document.styleSheets.length-1];
                CSS_Rules = style_sheet.cssRules;

                for (const rule of CSS_Rules) {
                    if (rule.cssText.includes('.news-item {')) {
                        var nItemStyleS = rule.cssText
                    }
                }

                const emWidth = +nItemStyleS.split('width: ')[1].split('em')[0]

                const mHeightEm = +nItemStyleS.split('max-height: ')[1].split('em')[0]

                var nNewsI = newsItemsJ.length

                function updateGrid() {
                    var test = []
                    let sConD = sConHCR(newsItems.length)
                    sCon.style.height = sConD.height + 'px'
                    sCon.replaceChildren(...gridify(sConD.nRows, sConD.nCols, newsItems))
                }
                //uses flexbox columns to create a masonry-like grid
                function gridify(rows, cols, gridlings) {

                    const restyleNewsder = gridlings.length % cols

                    if (restyleNewsder) {
                        rows--
                    }

                    var columns = []

                    for (let c = 1; c < cols+1; c++) {
                        columns[c] = document.createElement('div')
                        columns[c].className = "flex direction-column"
                        const column = columns[c]
                        for (let r = 1; r < rows+1; r++) {
                            const gridIndex = (r - 1)*cols + c
                            const elem = gridlings[gridIndex-1]
                            if (elem) {
                                //a element within newsItem
                                const hasImg = elem.firstChild.children[0].tagName === 'IMG';
                                try {;
                                    //todo: un-hardcode this stuff better!!
                                    elem.firstChild.children[1 + hasImg].tabIndex = gridIndex + 3;
                                    if (elem.children.length == 4) {
                                        elem.children[2].tabIndex = gridIndex + 3;
                                    }
                                }
                                catch {
                                    console.log(elem)
                                }
                            }
                            column.append(elem)
                        }
                    }

                    return columns.slice(1)
                }
                var nItems = Array.from(document.querySelectorAll('.news-item'))
                
                if (!newsItems) {
                    var newsItems = Array.from(sCon.cloneNode(true).children)
                }

                var nItemsB = Array.from(document.querySelectorAll('.news-item'))
            
                updateGrid()
                
            }

            async function initNews() {

                const sources = getSelectedSources();

                styleNews(newsItemsJ);
            }

            initNews();


            //from https://dev.to/teaganga/understanding-debounce-in-javascript-a-guide-with-examples-3cm4
            function debounce(func, wait) {
                    let timeout;
                    return function (...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            const uGridD = debounce(updateGrid, 250);
                // Create a debounced version of updateGrid with a 250ms delay
